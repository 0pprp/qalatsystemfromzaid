# nginx.conf

server {
    listen 80;
    server_name localhost;

    # Proxy لتجاوز CORS عند جلب بيانات المدن من defaultdata API
    location /api-defaultdata/ {
        proxy_pass http://defaultdata.alsaaeidy.com/;
        proxy_set_header Host defaultdata.alsaaeidy.com;
        proxy_set_header Origin "";
    }

    # BE_SalesEmployee الحالي على 5280 — بدون port جديد على 80
    location /sales-gw/ {
        proxy_pass http://127.0.0.1:5280/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # BE_CustomerApp (تطبيق الزبون) على 5380 — نفس أسلوب /sales-gw/
    # BE_PromotersApp (المروّجون أونلاين) admin API + marketing uploads
    location /promoters-app/ {
        proxy_pass http://127.0.0.1:5430/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 310m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /customer-app/ {
        proxy_pass http://127.0.0.1:5380/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 110m;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Additional configurations go here...
}
