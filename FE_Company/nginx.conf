# nginx.conf

server {
    listen 80;
    server_name localhost;

    # Proxy لتجاوز CORS عند جلب بيانات المدن من defaultdata API
    location /api-defaultdata/ {
        proxy_pass http://defaultdata.alsaaeidy.com/;
        proxy_set_header Host defaultdata.alsaaeidy.com;
        proxy_set_header Origin "";
    }

    # BE_SalesEmployee الحالي على 5280 — بدون port جديد على 80
    location /sales-gw/ {
        proxy_pass http://127.0.0.1:5280/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Additional configurations go here...
}
