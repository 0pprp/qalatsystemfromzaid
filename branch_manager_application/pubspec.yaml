name: branch_manager_application
description: تطبيق إدارة الفرع — قرارات، متابعة الفرع، ومحافظات متعددة.

publish_to: "none"

version: 1.0.42+43

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  package_info_plus: ^8.1.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  share_plus: ^10.1.4
  path: ^1.9.1
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
