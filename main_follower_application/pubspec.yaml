name: main_follower_application
description: تطبيق المتابع الرئيسي — مهام اللجان متعددة المحافظات.

publish_to: "none"
version: 1.0.5+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  package_info_plus: ^8.1.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
