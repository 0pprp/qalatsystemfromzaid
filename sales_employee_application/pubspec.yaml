name: sales_employee_application
description: تطبيق موظف المبيعات — بحث، تقييم، مبيع، وتتبع مسار.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  intl: ^0.20.2
  pdf: ^3.11.3
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  image_picker: ^1.1.2
  path: ^1.9.1
  sqflite: ^2.4.2
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/LogoCompany.png
    - assets/icons/logo_last.png
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
